# Photographs for the PUBLIC website.
#
# NO VISIBLE CAPTIONS — decided by Cong. The pictures speak for themselves and the
# page shows them without text underneath. Do not reintroduce a caption line.
#
# `alt` is NOT a caption and must never be dropped: it is invisible to sighted
# readers and is the only thing a screen-reader user receives about the picture.
#
# Ordering is by the `iso` field, newest first, done by the template.
#
# Fields:
#   image    required. Base filename in assets/img/gallery/. The template expects
#            both <name>.jpg (full) and <name>-thumb.jpg (grid) to exist.
#   alt      required. Describes the picture for anyone who cannot see it.
#   iso      optional. YYYY-MM-DD, for ordering only. Unknown is fine.
#
# Every photograph here shows identifiable people. Adding one is a decision about
# them, not just about the page.

- image: team-meal
  alt: >
    Thirteen members of the unit seated together along one side of a long table in
    a restaurant, several holding up a tote bag printed with a cartoon design.

- image: team-steps
  alt: >
    Fifteen members of the unit standing in two rows on the steps of a large white
    colonnaded building, one of them holding a bouquet of pink and white flowers.

- image: team-plaza
  alt: >
    Sixteen members of the unit standing in a line across a wide paved plaza, with
    a colonnaded monument and fountain in the distance behind them.
