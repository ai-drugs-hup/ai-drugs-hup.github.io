# The roster for the PUBLIC website.
#
# This file is the site's own source of truth. It was seeded once by hand from the lab roster and
# is NOT synced with anything — the private roster must never be copied here again.
#
# Fields:
#   name   required. As the person wants it written, with diacritics.
#   role   required. Job title, not team name.
#   team   "Principal investigator" | "AI team" | "MD team" | "Synthesis team"
#          | "Alumni"
#   photo  optional. Filename in assets/img/team/. Omit it and the card shows an initials circle.
#   initials optional. Overrides the computed initials, which take the first and
#          last word of the name — wrong when a Western given name is appended.
#   links  optional. email / scholar / orcid / github
#   until  optional, Alumni only. The year the person left the lab. Omit it rather
#          than guess — the card drops the line when it is absent.
#
# ⚠️ Roles below describe what someone works on. Dr. Dung confirmed the lab is
#    mostly students, so members default to "Student researcher".
#    CONFIRMED individually: Nguyễn Thành Công and Trần Tùng Lâm are master's
#    students (confirmed by Cong). Everyone else still carries the default and has
#    NOT been confirmed one by one — correct any line that is wrong.

